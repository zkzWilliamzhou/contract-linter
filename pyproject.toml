[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-linter"
version = "1.0.0"
description = "C++26 Contracts Static Analysis Tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "contract-linter team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["cpp", "contract", "static-analysis", "linter", "c++26"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
contract-linter = "contract_linter:main"

[project.urls]
Homepage = "https://github.com/zkzWilliamzhou/contract-linter"
Documentation = "https://github.com/zkzWilliamzhou/contract-linter#readme"
Repository = "https://github.com/zkzWilliamzhou/contract-linter.git"
Issues = "https://github.com/zkzWilliamzhou/contract-linter/issues"

[tool.pytest.ini_options]
testpaths = ["contract_linter/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]